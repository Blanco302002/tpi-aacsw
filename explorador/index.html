    REALES.forEach(function (r) { bReal[r[0]].textContent = t.reales[r[0]]; });

    $("aviso").textContent = t.aviso; $("tPie").textContent = t.pie;
    $("lES").className = lang === "es" ? "activo" : ""; $("lEN").className = lang === "en" ? "activo" : "";
  }
  function detalle() {
    var d = $("detalle"), t = L();
    if (!ultimo) { d.style.display = "none"; return; }
    var s = ultimo;
    var h = "<h3>" + nombre(s) + "</h3>" + t.depende + ": <b>" + (s.empresas.length ? s.empresas.map(empresa).join(", ") : t.sinDato) + "</b>" +
      "<br>" + t.principal + ": " + empresa(s.principal);
    REALES.forEach(function (r) {
      var a = afectado(s, r[0]); if (a === "no reportado") return;
      var f = s.se_cayo[r[0]].fuente.split(": ")[0];
      h += "<br>" + t.reales[r[0]].split(" · ")[0] + ": <b>" + t.estado[a] + "</b> <span style='color:var(--muted)'>(" + f + ")</span>";
    });
    d.innerHTML = h; d.style.display = "block";
  }
  function pintar() {
    var t = L(), mias = S.filter(function (s) { return marcadas[s.servicio]; });
    Object.keys(bEmp).forEach(function (k) { bEmp[k].className = modo === "sim" && eleccion === k ? "activo" : ""; });
    Object.keys(bReal).forEach(function (k) { bReal[k].className = modo === "real" && eleccion === k ? "activo real" : ""; });
    S.forEach(function (s) {
      var b = fichas[s.servicio], m = !!marcadas[s.servicio], cls = "ficha", marca = "";
      if (m) cls += " marcada";
      if (modo === "sim") {
        if (esPrincipal(s, eleccion)) cls += " apagada"; else if (depende(s, eleccion)) cls += " riesgo";
        if (!m) cls += " tenue";
      } else if (modo === "real") {
        var a = afectado(s, eleccion);
        if (a === "confirmado") { cls += " apagada"; marca = "●"; } else if (a === "reportado en medios") { cls += " medios"; marca = "◐"; }
        if (!m) cls += " tenue";
      }
      b.className = cls; b.setAttribute("aria-pressed", m ? "true" : "false");
      b.innerHTML = ""; b.appendChild(document.createTextNode(nombre(s)));
      if (marca) { var sp = document.createElement("span"); sp.className = "marca"; sp.textContent = marca; b.appendChild(sp); }
    });
    var r = $("resultado"), k = $("claves");
    if (!modo) {
      r.innerHTML = mias.length ? t.elegiste(mias.length) : t.inicio(S.length);
      k.innerHTML = "";
    } else if (modo === "sim") {
      var nom = nombreEmpresa(eleccion);
      var ap = mias.filter(function (s) { return esPrincipal(s, eleccion); }).length;
      var rg = mias.filter(function (s) { return !esPrincipal(s, eleccion) && depende(s, eleccion); }).length;
      var tot = S.filter(function (s) { return esPrincipal(s, eleccion); }).length;
      var hubo = eleccion === "Cloudflare" || eleccion === "Amazon (AWS)";
      r.innerHTML = "<b>" + (mias.length ? t.apagan(ap, mias.length, rg) : t.principalSolo(nom, tot, S.length)) + "</b>" +
        "<small>" + (mias.length ? t.principalDe(nom, tot, S.length) + " " : "") + (hubo ? t.hubo : t.simulacion) + "</small>";
      k.innerHTML = t.claveSim;
    } else {
      var real = REALES.filter(function (x) { return x[0] === eleccion; })[0];
      var c = S.filter(function (s) { return afectado(s, eleccion) !== "no reportado"; });
      var mc = mias.filter(function (s) { return afectado(s, eleccion) !== "no reportado"; });
      var sinDep = c.filter(function (s) { return !depende(s, real[1]); }).length;
      r.innerHTML = "<b>" + (mias.length ? t.fallaron(mc.length, mias.length) : t.fallaronTodos(c.length, S.length)) + "</b><small>" +
        (eleccion === "crowdstrike" ? t.crowd : t.sinDep(sinDep, c.length, real[1])) + "</small>";
      k.innerHTML = t.claveReal;
    }
    detalle();
  }
  textos(); pintar();
})();
</script>
